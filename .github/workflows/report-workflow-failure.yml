name: Report workflow failure to project board

# Files an issue when a workflow fails, and CLOSES it when the same workflow next passes on the
# same branch.
#
# The closing half is not a nicety. Without it every failure left an issue that nothing ever
# resolved, so the boards filled with notices about runs that had been fixed months earlier: 103
# open across the repositories by September 2026, every one of them stale, and a real bug filed
# among them would have been invisible. An issue here is a notification about a moment, not a
# tracked piece of work, so the run that disproves it is what should close it.

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions: {}

jobs:
  report:
    # Both outcomes: one files, the other clears.
    #
    # Only for runs of this repository's own branches. A failing pull request from a fork is the
    # contributor's to fix, and must not be able to file issues on the maintainers' board.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.NEXUS_PLM_PROJECT_TOKEN }}
        script: |
          const projectId     = 'PVT_kwDOD-RDF84BUbus';
          const statusField   = 'PVTSSF_lADOD-RDF84BUbuszhBj2nw';
          const failedActions = 'fd4dcc66';

          const run = context.payload.workflow_run;

          // Skip enforcement/policy workflows -- their failures are intentional
          const skipNames = [
            'Report workflow failure to project board',
            'Enforce PRs to main must come from next',
            'Enforce working branches must be created from next',
            'Add PR to project',
            'Auto PR next -> main',
            'Mark project item Done or Cancelled when PR closes',
          ];
          if (skipNames.includes(run.name)) return;
          if (run.path && run.path.includes('enforce')) return;

          const sha    = run.head_sha.substring(0, 7);
          const branch = run.head_branch;
          const prefix = `Action failed: ${run.name} on ${branch}`;
          const title  = `${prefix} (${sha})`;

          // The repository's open issues. listForRepo also returns pull requests, which are issues
          // to this API and are not what any of this is about.
          const { data: everything } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100
          });
          const open = everything.filter(i => !i.pull_request);

          // ---- the run passed: clear what its own failures filed --------------------------
          if (run.conclusion === 'success') {
            const resolved = open.filter(i => i.title.startsWith(prefix));
            for (const issue of resolved) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Fixed: **${run.name}** passed on \`${branch}\` at \`${sha}\`. [View run](${run.html_url})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed #${issue.number} — ${run.name} passes again on ${branch}`);
            }
            if (resolved.length === 0) core.info('Nothing open for this workflow and branch.');
            return;
          }

          // ---- the run failed -------------------------------------------------------------
          // Deduplicate: if an open issue exists for this workflow+branch, comment instead
          const sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

          const dupe = open.find(i =>
            i.title.startsWith(prefix) && new Date(i.created_at) > sevenDaysAgo
          );

          if (dupe) {
            // Add a comment to the existing issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: dupe.number,
              body: `Still failing on \`${branch}\` — commit \`${sha}\`: ${run.head_commit?.message?.split('\n')[0] || ''}\n[View logs](${run.html_url})`
            });
            core.info(`Commented on existing issue #${dupe.number}`);
            return;
          }

          // Create new issue
          const body = [
            `Workflow **${run.name}** failed on branch \`${branch}\`.`,
            ``,
            `**Commit:** \`${sha}\` -- ${run.head_commit?.message?.split('\n')[0] || ''}`,
            `**Run:** [View logs](${run.html_url})`,
            ``,
            `This closes itself when **${run.name}** next passes on \`${branch}\`.`
          ].join('\n');

          const { data: issue } = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body
          });

          // Add to project board
          let itemId;
          try {
            const result = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }`,
              { projectId, contentId: issue.node_id }
            );
            itemId = result.addProjectV2ItemById.item.id;
          } catch(e) {
            core.warning('Could not add issue to project: ' + e.message);
            return;
          }

          // Place in Failed Actions column
          try {
            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`,
              { projectId, itemId, fieldId: statusField, optionId: failedActions }
            );
          } catch(e) {
            core.warning('Could not set Failed Actions column: ' + e.message);
          }
